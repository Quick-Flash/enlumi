name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: ubuntu-latest
            container: archlinux:base-devel
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - name: Arch build libraries
        if: matrix.container != ''
        working-directory: .
        run: |
          pacman -Syu --noconfirm --needed git rustup python pkgconf \
            libx11 libxkbcommon libxkbcommon-x11 wayland libxcb libxcursor \
            libxi libxrandr fontconfig ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build libraries
        if: runner.os == 'Linux' && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            fonts-dejavu-core
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/xtask
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.container }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.container }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Rust filter toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Rust / WASM integration tests
        run: cargo test --locked -p enlumi script_e2e -- --ignored --nocapture
      - name: Portable bundle and compiler check without system Rust
        run: cargo xtask bundle
