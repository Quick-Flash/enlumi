name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: ubuntu-latest
            container: archlinux:base-devel
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      ENLUMI_BUILD_COMMIT: ${{ github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    timeout-minutes: 60
    steps:
      - name: Arch build libraries
        if: matrix.container != ''
        working-directory: .
        run: |
          pacman -Syu --noconfirm --needed git rustup python pkgconf \
            libx11 libxkbcommon libxkbcommon-x11 wayland libxcb libxcursor \
            libxi libxrandr fontconfig ttf-dejavu
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Linux build libraries
        if: runner.os == 'Linux' && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            fonts-dejavu-core
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.container }}
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Native Wayland backend tests
        if: runner.os == 'Linux'
        run: cargo test --locked -p zgui-platform-wayland --lib
      - name: Rust filter toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Rust / WASM integration tests
        run: cargo test --locked -p enlumi script_e2e -- --ignored --nocapture
      - name: Portable bundle and compiler check without system Rust
        run: cargo xtask bundle
