name: Nightly releases

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-latest
            platform: arch-linux-x86_64
            container: archlinux:base-devel
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      ENLUMI_BUILD_PLATFORM: ${{ matrix.platform }}
      ENLUMI_BUILD_COMMIT: ${{ github.sha }}
    timeout-minutes: 60
    steps:
      - name: Arch build libraries
        if: matrix.container != ''
        working-directory: .
        run: |
          pacman -Syu --noconfirm --needed git rustup python pkgconf \
            libx11 libxkbcommon libxkbcommon-x11 wayland libxcb libxcursor \
            libxi libxrandr fontconfig ttf-dejavu
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Linux build libraries
        if: runner.os == 'Linux' && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            fonts-dejavu-core
      - name: Compiler and WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/xtask
          key: nightly-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Tests
        run: cargo test --locked --workspace
      - name: Build portable bundle and check compiler without system Rust
        run: cargo xtask bundle
      - name: Compress portable bundle
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          import os, pathlib, tarfile, zipfile
          platform = os.environ['PLATFORM']
          source = pathlib.Path('target/enlumi-portable')
          pathlib.Path('dist').mkdir()
          if platform.startswith('windows-'):
              with zipfile.ZipFile(f'dist/enlumi-{platform}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(source.parent))
          else:
              with tarfile.open(f'dist/enlumi-{platform}.tar.gz', 'w:gz') as archive:
                  archive.add(source, arcname=source.name)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-${{ matrix.platform }}
          path: dist/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    # Manual runs from other branches may build, but never publish releases.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Publish complete nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd dist && sha256sum enlumi-* > SHA256SUMS)
          cat > notes.md <<EOF
          Automated nightly build from commit ${COMMIT}.

          Extract entire archive; keep rust-toolchain beside executable.
          Includes offline Rust filter compiler and example profiles.
          Windows: ZIP. Linux/macOS: tar.gz. Choose matching architecture.
          Builds are unsigned; macOS builds are not notarized.
          Linux: linux-x86_64 targets Ubuntu 22.04+ compatible systems.
          Arch Linux / rolling Arch derivatives: choose arch-linux-x86_64.

          Experimental build. Previous nightlies remain available.
          EOF
          gh release create "$tag" dist/* --target "$COMMIT" \
            --title "Nightly $(date -u +%Y-%m-%d)" --notes-file notes.md \
            --prerelease --latest=false --draft
          gh release edit "$tag" --draft=false
