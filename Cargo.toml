[package]
name = "enlumi"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier"]
description = "Native time-series log viewer with docked plots and named filter chains"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["logs", "time-series", "plotting", "visualization"]
categories = ["visualization", "gui"]
publish = false

[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
async-channel = "2.5"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
bbl_parser = { version = "1.1.1", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
kurbo = "0.13.1"
mavlink-core = { version = "0.19.1", default-features = false, features = ["std"] }
plot = { package = "zgui-plot", git = "https://github.com/Quick-Flash/zgui-plot", rev = "eb9a799f55686b1a435c4335735eae39b5a8f1a0", features = ["workspace", "raster", "clipboard"] }
px4-ulog = "0.6.1"
rayon = "1.12"
rfd = "0.17.2"
# Enable embedded basemap PNGs in zgui-plot's shared PNG/clipboard rasterizer.
resvg = { version = "0.46", default-features = false, features = ["raster-images"] }
rustfft = { version = "6.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tar = "0.4"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
syn = { version = "3.0.9", features = ["full"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
# Framework revision from Quick-Flash/zgui branch enlumi/wayland-dnd-actions.
zgui = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-image = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-editor = { git = "https://github.com/Quick-Flash/zgui-editor", rev = "a5f84d76cd3f7e28860ea637f1e244501b524844", features = ["lang-rust"] }
zgui-ui = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-ui-primitives = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-ui-tokens = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }

[target.'cfg(target_os = "linux")'.dependencies]
zgui-platform-wayland = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }

[build-dependencies]
mavlink-bindgen = { version = "0.19.1", default-features = false, features = ["mav2-message-extensions"] }
quick-xml = "0.41"
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
accesskit = "0.24"
zgui-render-wgpu = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-render-vector-vello = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-profile = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-testkit-view = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-platform-headless = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-testkit-scene = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

# Keep upstream dependencies from editor/plot on the same framework fork.
# PR branches and aggregate revisions: docs/UPSTREAM_PATCHES.md.
[patch."https://github.com/zortax/zgui"]
zgui = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-css = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-interned = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-profile = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-text-style = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
zgui-ui = { git = "https://github.com/Quick-Flash/zgui", rev = "abc660ae5d6d39953412c8f5c32801bfb35ef341" }
