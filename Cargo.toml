[package]
name = "enlumi"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier"]
description = "Native PX4 ULog viewer with docked plots and named filter chains"
license = "MIT OR BSD-3-Clause"
readme = "README.md"
keywords = ["px4", "ulog", "plotting", "visualization"]
categories = ["visualization", "gui"]
publish = false

[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
kurbo = "0.13.1"
plot = { package = "zgui-plot", git = "https://github.com/Quick-Flash/zgui-plot", rev = "e2e03e54b2d78571a5a448814c3eab76204adf71", features = ["workspace"] }
px4-ulog = "0.6.1"
rfd = "0.17.2"
zgui = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }

[target.'cfg(target_os = "linux")'.dependencies]
zgui-platform-winit = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }

[dev-dependencies]
zgui-testkit-view = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }
zgui-platform-headless = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
