[package]
name = "enlumi"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier"]
description = "Native PX4 ULog viewer with docked plots and named filter chains"
license = "MIT OR BSD-3-Clause"
readme = "README.md"
keywords = ["px4", "ulog", "plotting", "visualization"]
categories = ["visualization", "gui"]
publish = false

[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
kurbo = "0.13.1"
plot = { package = "zgui-plot", git = "https://github.com/Quick-Flash/zgui-plot", rev = "40e0ad7d6263f89765e0cf439ea48d5a7b7ee5ec", features = ["workspace"] }
px4-ulog = "0.6.1"
rfd = "0.17.2"
zgui = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }
zgui-ui = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }
zgui-ui-tokens = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }

[target.'cfg(target_os = "linux")'.dependencies]
zgui-platform-winit = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }

[dev-dependencies]
zgui-testkit-view = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }
zgui-platform-headless = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }
zgui-testkit-scene = { git = "https://github.com/Quick-Flash/zgui", rev = "63f1c182e5f2c5c495304c008907e458a2e40fa8" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
