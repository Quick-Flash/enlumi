[package]
name = "enlumi"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier"]
description = "Native time-series log viewer with docked plots and named filter chains"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["logs", "time-series", "plotting", "visualization"]
categories = ["visualization", "gui"]
publish = false

[workspace]
members = [".", "xtask"]
exclude = ["vendor/zgui-runtime", "vendor/zgui-editor", "vendor/zgui-platform-wayland"]
resolver = "3"

[dependencies]
async-channel = "2.5"
bbl_parser = { version = "1.1.1", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
kurbo = "0.13.1"
mavlink-core = { version = "0.19.1", default-features = false, features = ["std"] }
plot = { package = "zgui-plot", git = "https://github.com/Quick-Flash/zgui-plot", rev = "321254ad3025926647b93e92998a18d09c6f380f", features = ["workspace", "raster", "clipboard"] }
px4-ulog = "0.6.1"
rayon = "1.12"
rfd = "0.17.2"
rustfft = { version = "6.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tar = "0.4"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
syn = { version = "3.0.9", features = ["full"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
zgui = { git = "https://github.com/zortax/zgui" }
zgui-editor = { git = "https://github.com/zortax/zgui-editor", rev = "1f7aaec6e4e2dfaee4d26b049a719d9e88d16f8f", features = ["lang-rust"] }
zgui-ui = { git = "https://github.com/zortax/zgui" }
zgui-ui-primitives = { git = "https://github.com/zortax/zgui" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui" }

[target.'cfg(target_os = "linux")'.dependencies]
zgui-platform-wayland = { git = "https://github.com/zortax/zgui" }

[build-dependencies]
mavlink-bindgen = { version = "0.19.1", default-features = false, features = ["mav2-message-extensions"] }
quick-xml = "0.41"
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
accesskit = "0.24"
zgui-render-wgpu = { git = "https://github.com/zortax/zgui" }
zgui-render-vector-vello = { git = "https://github.com/zortax/zgui" }
zgui-profile = { git = "https://github.com/zortax/zgui" }
zgui-testkit-view = { git = "https://github.com/zortax/zgui" }
zgui-platform-headless = { git = "https://github.com/zortax/zgui" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui" }

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }


# Temporary upstream UI fixes. See vendor/README.md.
[patch."https://github.com/zortax/zgui"]
zgui-runtime = { path = "vendor/zgui-runtime" }
zgui-platform-wayland = { path = "vendor/zgui-platform-wayland" }

[patch."https://github.com/zortax/zgui-editor"]
zgui-editor = { path = "vendor/zgui-editor" }
