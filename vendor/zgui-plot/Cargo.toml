[package]
name = "zgui-plot"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier <kevin.plaizier@tealdrones.com>"]
description = "Reusable 2D plotting, retained Zgui rendering, exports, and docking workspace controls"
license = "MIT OR BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/Quick-Flash/zgui-plot"
keywords = ["plotting", "visualization", "zgui", "charts", "docking"]
categories = ["graphics", "gui"]
include = ["Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-BSD-3-Clause", "src/**", "examples/**", "tests/**"]

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"], optional = true }
kurbo = "0.13.1"
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"], optional = true }
zgui = { git = "https://github.com/zortax/zgui", optional = true }
zgui-profile = { git = "https://github.com/zortax/zgui", optional = true }
zgui-ui = { git = "https://github.com/zortax/zgui", optional = true }

[features]
default = []
zgui = ["dep:zgui", "dep:zgui-profile"]
raster = ["dep:resvg"]
clipboard = ["raster", "dep:arboard"]
workspace = ["zgui", "dep:zgui-ui"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
zgui-platform-headless = { git = "https://github.com/zortax/zgui" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui" }

[[example]]
name = "waves"
required-features = ["zgui"]

[[example]]
name = "time_series"
required-features = ["workspace"]

[[example]]
name = "data_plots"
required-features = ["workspace"]

[workspace]
resolver = "3"

[patch."https://github.com/zortax/zgui"]
zgui-runtime = { path = "../zgui-runtime" }
zgui-render-wgpu = { path = "../zgui-render-wgpu" }
