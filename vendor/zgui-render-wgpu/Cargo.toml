# Expanded from zortax/zgui 951a0ea; see vendor/README.md.
[package]
name = "zgui-render-wgpu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "wgpu renderer for zgui scenes"
repository = "https://github.com/zortax/zgui"
homepage = "https://zgui.zortax.de"
rust-version = "1.90"
keywords = ["gui", "ui", "css", "reactive", "wgpu"]
categories = ["gui"]
include = ["/src", "/build", "/build.rs", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
bincode = { version = "1.3" }
bytemuck = { version = "1.25", features = ["derive"] }
futures = { version = "0.3", features = ["thread-pool"] }
naga = { version = "29.0.4", features = ["deserialize"] }
rustc-hash = { version = "2.1" }
tracing = { version = "0.1.44" }
wgpu = { version = "29.0.4", features = ["naga-ir"] }
zgui-atlas = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-bits = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-color = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-geom = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-profile = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-render = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-scene = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
zgui-wgsl = { version = "0.1.0", git = "https://github.com/zortax/zgui" }

[build-dependencies]
bincode = { version = "1.3" }
naga = { version = "29.0.4", features = ["wgsl-in", "serialize"] }
zgui-wgsl = { version = "0.1.0", git = "https://github.com/zortax/zgui" }
